# Frontier calibration case: stage admission of attention-DP lanes under PP.
# Structural comparison (plan §4.7, D-8). No E2E latency gate: the Frontier
# side runs the dummy predictor, and the fix changes admission, not durations.

case_id: stage_admission_case_001
run_generation: 1
created_at_utc: "2026-09-23"
requesting_user: i-fengyicheng
reviewer_identity: i-fengyicheng
auto_recycle: false

purpose: >-
  Check that the stage-admission rule of plan P1 makes Frontier's attention-DP
  lanes behave like vLLM V1 data-parallel ranks at pipeline_parallel_size 2:
  a rank with runnable work is not refused at its stage by another rank's
  queued work, both ranks start in the same forward slot, and stage-0 forwards
  pair one to one. Criterion C7 of plan.md.

