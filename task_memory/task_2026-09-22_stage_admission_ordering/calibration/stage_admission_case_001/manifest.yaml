groundtruth_dirty_patch_sha256: null
groundtruth_overlay_patch_applied: true   # run sa-pp-20260923b; run sa-pp-20260923a had none
groundtruth_overlay_patch: inputs/groundtruth_overlay.patch
groundtruth_overlay_patch_sha256: 8d47678911b7b689bc644ea81bd9d2200ea296d773ee9c07a1c5a9bc9b3a9c81
groundtruth_overlay_patch_reason: >-
  Fork commit 1109c4f16 passes a fifth renormalize argument to
  _moe_C::topk_softmax; the fork's own csrc (unchanged from upstream-v0.10.2)
  and the v0.10.2 image declare four, so run a failed in the MoE profile_run.
  The patch restores the upstream four-argument wrapper (vllm/_custom_ops.py)
  and call (fused_moe.py vllm_topk_softmax). Numerics are unchanged: Python
  renormalizes after the call. The checkout is not modified.
groundtruth_overlay: >-
  The worker copies the image's installed vllm package and copies every
  vllm/**/*.py of the checkout over it. It runs only when the files where image
  and checkout differ are exactly the .py files of fork_changed_files.txt
  (overlay_report.json in the run directory).
groundtruth_weight_mode: dummy
real_weight_download: false

topology:
  vllm: "data_parallel_size=2, pipeline_parallel_size=2, tensor_parallel_size=1; MoE adds enable_expert_parallel"
  frontier: "attn_dp=2, num_pipeline_stages=2, attn_tp=1, one Replica; MoE adds moe_tp=1, moe_ep=2"
  devices: 4x H800 (vLLM); h800 / h800_dgx (Frontier)
  cluster_scheduler: round_robin (request i to lane i mod 2)
  replica_scheduler: vllm_v1

models:
  moe: data/config/models/Qwen3-30B-A3B-tiny.json
  dense: data/config/models/Llama-3.2-1B-Instruct.json

settings:
  dtype: bfloat16
  prompt_tokens: 256
  output_tokens: 1
  max_num_batched_tokens: 256
  max_num_seqs: 4
  block_size: 16
  chunked_prefill: true
  prefix_caching: false
  graph_mode: eager
  frontier_num_blocks: 1024
  vllm_gpu_memory_utilization: 0.5
  vllm_num_gpu_blocks: recorded in runs/vllm-instrumented/<run>/runs/<model>/summary.json

workload:
  request_id_namespace: "<burst>-q<index>; burst = warmup | b<n>-r<round>"
  request_id_encoding: "AsyncLLM.add_request request_id, unchanged into the engine (n=1)"
  frontier_request_ids: "0..n-1, mapped to vLLM b<n>-r<round>-q<index> by index"
  lane_assignment: "index mod 2 (vLLM data_parallel_rank; Frontier round robin)"
  warmup_request_ids: [warmup-q0, warmup-q1, warmup-q2, warmup-q3]
  formal_request_ids: "b8-r{0,1,2}-q{0..7}, b16-r{0,1,2}-q{0..15}"
  rounds_per_burst: 3
  idle_between_rounds: "engines paused (dp_engines_running false), then 1 s"

modes:
  groundtruth_instrumented:
    env: "VLLM_FRONTIER_INSTRUMENTATION=1, VLLM_FRONTIER_PP_BOUNDARY_LOG_PATH, VLLM_FRONTIER_DP_PLACEMENT_LOG_DIR, VLLM_WORKER_MULTIPROC_METHOD=spawn"
    producer: tests/comparison/stage_admission_pp/run_vllm_worker.sh
    artifact_path: runs/vllm-instrumented/<RUN_TAG>/ (archive /mnt/codesign-exp/ycfeng/frontier/stage_admission_pp/<RUN_TAG>/)
    status: COMPLETE
    runs:
      - run_tag: sa-pp-20260923a
        rjob: exp-0923-022226-151935
        overlay_patch: none
        result: "dense complete; MoE failed (_moe_C::topk_softmax 5 vs 4 arguments); job Failed"
      - run_tag: sa-pp-20260923b
        rjob: exp-0923-024146-345158
        overlay_patch: inputs/groundtruth_overlay.patch
        result: "MoE and dense complete; job Succeeded; used by analysis/"
  groundtruth_clean:
    status: NOT_APPLICABLE   # no E2E latency gate (D-8)
  simulator_before:
    source: /data/ycfeng/tmp/stage_admission_ordering/base/G7-*
    status: COMPLETE   # MoE n8/n16 admission_deadlock; dense n8/n16 success
  simulator_after:
    source: /data/ycfeng/tmp/stage_admission_ordering/after/G7-*
    status: COMPLETE   # all four G7 cases success at dac4e69

