groundtruth_instrumentation:
  gate_env_var: VLLM_FRONTIER_DP_PLACEMENT_LOG_DIR
  output: one JSONL file per process, named dp_placement_<pid>.jsonl
  buffering: write-through; one line-buffered file per process, one JSON line per record, seq restarted in a forked child
  changed_files:
    - vllm/v1/frontier_trace.py
    - vllm/v1/engine/core.py
    - vllm/v1/engine/coordinator.py
    - vllm/v1/engine/core_client.py
  record_kinds:
    engine_iteration:
      written_by: DPEngineCoreProc.run_busy_loop
      join_key: [engine, wave, step]
      fields: [branch, applied_output, queue_occupancy, scheduled_new_req_ids,
               num_scheduled_tokens, waiting, running, published]
    coordinator_receive:
      written_by: DPCoordinatorProc.process_input_socket
      join_key: [engine, wave, step]
      fields: [waiting, running, disposition, latched_counts]
    coordinator_publish:
      written_by: DPCoordinatorProc.process_input_socket
      join_key: [snapshot]
      fields: [counts, counts_source, wave, engines_running]
    frontend_snapshot:
      written_by: DPLBAsyncMPClient stats update task
      join_key: [snapshot]
      fields: [counts, wave, engines_running]
    frontend_route:
      written_by: DPLBAsyncMPClient.get_core_engine_for_request
      join_key: [request_id, snapshot]
      fields: [engine, counts, score, start_index, reservation]
  wire_change: >-
    The coordinator's front-end publication carries a fourth element, the
    snapshot id. Both the only sender and the only receiver are in this
    checkout. Without it an applied snapshot cannot be tied to the engine
    reports it came from, which is the join T1 needs.
  scheduler_py_unchanged: >-
    The plan listed vllm/v1/core/sched/scheduler.py as a likely change for a
    dp_rank column. It is not needed: SchedulerOutput already carries
    scheduled_new_reqs and total_num_scheduled_tokens, and the engine record is
    written by the engine that owns the rank.

