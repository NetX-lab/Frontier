name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - qwen3-4b-pd-af-simulator
  workflow_dispatch:
    inputs:
      pr_number:
        description: '需要手动重新审查的 PR 编号'
        required: true
        type: string

concurrency:
  group: gemini-code-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: Gemini PR 自动代码审查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      has_review: ${{ steps.prepare_publish.outputs.has_review }}
      artifact_name: ${{ steps.prepare_publish.outputs.artifact_name }}

    steps:
      - name: Check GEMINI_API_KEY secret
        env:
          HAS_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          if [ "${HAS_GEMINI_API_KEY}" != "true" ]; then
            echo "::error::未配置仓库 Secret GEMINI_API_KEY。请在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中添加 GEMINI_API_KEY。"
            exit 1
          fi

      - name: Resolve PR number
        id: pr
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          PR_NUMBER="${EVENT_PR_NUMBER:-$INPUT_PR_NUMBER}"
          if [ -z "${PR_NUMBER}" ]; then
            echo "::error::无法解析 PR 编号。"
            exit 1
          fi
          echo "number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr_number) }}
          fetch-depth: 1
          persist-credentials: false

      - name: Ensure ripgrep is installed
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi
          rg --version | head -n 1

      - name: Prepare PR context and annotated diff
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELPER_PATH: ${{ runner.temp }}/gemini_review_helper.py
        run: |
          if ! gh api "repos/${{ github.repository }}/contents/.github/scripts/gemini_review_helper.py?ref=${{ github.sha }}" --jq .content | base64 -d > "${HELPER_PATH}"; then
            cp .github/scripts/gemini_review_helper.py "${HELPER_PATH}"
          fi
          python3 "${HELPER_PATH}" prepare \
            --pr-number "${{ steps.pr.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --output-dir .gemini-review-ctx \
            --repo-root "${PWD}" \
            --extra-context-lines 12

      - name: Skip review when no reviewable code files changed
        if: steps.prepare.outputs.reviewable_files == '0'
        run: |
          echo "本次 PR 改动均位于忽略路径（profiling/数据/图表/子模块），跳过 Gemini Code Review。" >> "${GITHUB_STEP_SUMMARY}"

      - name: Run Gemini CLI code review
        id: gemini_review
        if: steps.prepare.outputs.reviewable_files != '0'
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL || 'gemini-4-hydrogen' }}
          settings: |-
            {
              "model": {
                "maxSessionTurns": -1,
                "compressionThreshold": 0.15,
                "summarizeToolOutput": {
                  "run_shell_command": {
                    "tokenBudget": 2000
                  }
                }
              },
              "modelConfigs": {
                "customOverrides": [
                  {
                    "match": {
                      "model": "chat-base-3"
                    },
                    "modelConfig": {
                      "generateContentConfig": {
                        "thinkingConfig": {
                          "thinkingLevel": "${{ vars.GEMINI_THINKING_LEVEL || 'MEDIUM' }}"
                        }
                      }
                    }
                  },
                  {
                    "match": {
                      "model": "${{ vars.GEMINI_MODEL || 'gemini-4-hydrogen' }}"
                    },
                    "modelConfig": {
                      "generateContentConfig": {
                        "thinkingConfig": {
                          "thinkingLevel": "${{ vars.GEMINI_THINKING_LEVEL || 'MEDIUM' }}"
                        }
                      }
                    }
                  }
                ]
              },
              "context": {
                "fileName": [
                  ".gemini/styleguide.md"
                ]
              },
              "telemetry": {
                "enabled": false
              },
              "tools": {
                "useRipgrep": true,
                "truncateToolOutputThreshold": 24000,
                "core": [
                  "read_file",
                  "read_many_files",
                  "list_directory",
                  "glob",
                  "grep_search",
                  "run_shell_command(rg)",
                  "run_shell_command(git grep)",
                  "run_shell_command(git show)",
                  "run_shell_command(sed -n)",
                  "run_shell_command(nl)",
                  "run_shell_command(head)",
                  "run_shell_command(tail)",
                  "run_shell_command(wc)"
                ]
              }
            }
          prompt: |-
            你是 Frontier（LLM 推理离散事件仿真器）仓库的资深代码审查工程师。
            `.gemini/styleguide.md` 已自动注入上下文，无需再次读取。请按照以下步骤完成本次 Pull Request 的中文代码审查，并**严格只输出一个 JSON 对象**：

            1. 在**同一轮**内并行使用 `read_file` 阅读 `.gemini-review-ctx/pr_context.md` 和 `.gemini-review-ctx/pr_diff.txt`。
               - `.gemini-review-ctx/pr_diff.txt` 已为非测试源码自动预展开了 hunk 周边各 12 行上下文（`C<数字>` 前缀），**不要重复 `read_file` 已在 diff 中展示过的代码段**。
            2. **严格控制 Token 消耗与工具调用预算**：
               - 仅当 diff 及其 `C<数字>` 周边上下文仍不足以确认某个真实疑点时，才定向查阅直接相关的调用方或定义；**严禁为了“通读确认”去浏览没有疑点的文件**。
               - 优先用 `grep_search`（或 `rg -n`）定位精确行号，再调用带精确 `start_line` / `end_line` 的 `read_file`（**单次跨度 ≤ 120 行，严禁不带行号范围读取大文件**）。
               - **禁止对 `tests/` 目录下的测试文件调用 `read_file`**（测试改动已在 `pr_diff.txt` 中完整展示）。
               - **禁止整文件读取 `AGENTS.md`**（常规约束已包含在 `.gemini/styleguide.md` 中，仅在确有必要时用 `grep_search` / `rg -n` 精准检索关键词）。
               - **禁止遍历或扫描 `data/profiling/`、`figs/`、`cache/`、`outputs/` 等大体积目录**。
               - 将额外 `read_file` 总调用尽量控制在 **12 次以内**、总 API 轮次控制在 **6~10 轮以内**，足以做出判断后立即输出最终 JSON。
            3. **严格控制信噪比**：
               - 全程使用**简体中文**。
               - **只报告 `CRITICAL`（严重）、`HIGH`（高）、`MEDIUM`（中）级别问题**，彻底忽略 `LOW` / `NIT` / 纯格式风格问题。
               - 最多输出 15 条最具价值的问题；若无中高优先级问题，`comments` 返回空数组 `[]`。
            4. 行号要求：`.gemini-review-ctx/pr_diff.txt` 中前缀为 **`L<数字>`** 的行才是 GitHub PR diff 内可挂行内评论的精确行号（`C<数字>` 仅作上下文参考，不可直接挂行内评论）。行内评论的 `path` 必须是相对仓库根目录的路径（保留 `.github/` 等点开头前缀），`line` 必须是对应 diff hunk 中带 `L<数字>` 的整数行号；如问题跨文件或位于 `C<数字>` / diff 之外，可填相关文件并将 `line` 设为 `null`。

            最终回复**只能包含如下格式的纯 JSON（不要附加多余解释文本）**：
            ```json
            {
              "verdict": "APPROVE | COMMENT | REQUEST_CHANGES",
              "summary": "2-5 句简体中文总结：概括本次变更目的、核心风险点与整体评价。",
              "comments": [
                {
                  "path": "relative/path/to/file.py",
                  "line": 123,
                  "start_line": null,
                  "severity": "CRITICAL | HIGH | MEDIUM",
                  "category": "仿真保真度 | 逻辑缺陷 | 架构边界 | 性能 | 可维护性 | 测试覆盖 | 安全",
                  "title": "简短问题标题",
                  "body": "清晰的中文根因分析、影响范围与具体修改建议。",
                  "suggestion": null
                }
              ]
            }
            ```
            说明：`suggestion` 仅在你能给出可直接替换该行/该段代码的精确代码片段时填写（纯代码，不含 Markdown 围栏），否则填 `null`。

      - name: Prepare review bundle for publish
        id: prepare_publish
        if: steps.prepare.outputs.reviewable_files != '0'
        env:
          GEMINI_RESPONSE: ${{ steps.gemini_review.outputs.summary }}
          ARTIFACT_NAME: gemini-review-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          BUNDLE_DIR: ${{ runner.temp }}/gemini-review-bundle
          HELPER_PATH: ${{ runner.temp }}/gemini_review_helper.py
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          ctx_dir = Path(".gemini-review-ctx")
          bundle_dir = Path(os.environ["BUNDLE_DIR"])
          if bundle_dir.exists():
              shutil.rmtree(bundle_dir)
          bundle_dir.mkdir(parents=True, exist_ok=True)

          response_text = ""
          cli_stdout = Path("gemini-artifacts/stdout.log")
          if cli_stdout.is_file():
              try:
                  parsed = json.loads(cli_stdout.read_text(encoding="utf-8"))
                  if isinstance(parsed, dict) and isinstance(parsed.get("response"), str):
                      response_text = parsed["response"]
              except Exception:
                  pass
          if not response_text.strip():
              response_text = os.environ.get("GEMINI_RESPONSE", "")

          response_text = response_text.strip()
          (bundle_dir / "gemini_response.txt").write_text(response_text, encoding="utf-8")
          for filename in ("pr_meta.json", "valid_diff_lines.json"):
              shutil.copy2(ctx_dir / filename, bundle_dir / filename)
          helper_src = Path(os.environ["HELPER_PATH"])
          if not helper_src.is_file():
              helper_src = Path(".github/scripts/gemini_review_helper.py")
          shutil.copy2(helper_src, bundle_dir / "gemini_review_helper.py")

          artifact_name = os.environ["ARTIFACT_NAME"]
          has_review = "true" if response_text else "false"
          gh_output = os.environ.get("GITHUB_OUTPUT")
          if gh_output:
              with open(gh_output, "a", encoding="utf-8") as fh:
                  fh.write(f"has_review={has_review}\n")
                  fh.write(f"artifact_name={artifact_name}\n")
          print(
              f"Prepared Gemini review bundle in {bundle_dir}: {len(response_text)} chars "
              f"(has_review={has_review}, artifact_name={artifact_name})"
          )
          PY

      - name: Upload Gemini review bundle artifact
        if: steps.prepare_publish.outputs.has_review == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_publish.outputs.artifact_name }}
          path: ${{ runner.temp }}/gemini-review-bundle
          retention-days: 1
          if-no-files-found: error

      - name: Log Gemini CLI usage stats
        if: always() && steps.prepare.outputs.reviewable_files != '0'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          p = Path("gemini-artifacts/stdout.log")
          if not p.is_file():
              print("No gemini-artifacts/stdout.log found.")
              raise SystemExit(0)
          try:
              data = json.loads(p.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"Could not parse Gemini CLI JSON stats: {exc}")
              raise SystemExit(0)

          stats = data.get("stats") if isinstance(data, dict) else None
          if not isinstance(stats, dict):
              print("No stats object found in Gemini CLI JSON output.")
              raise SystemExit(0)

          lines = ["### Gemini CLI Usage Stats", ""]
          models = stats.get("models")
          if isinstance(models, dict):
              for model_name, ms in models.items():
                  if not isinstance(ms, dict):
                      continue
                  tok = ms.get("tokens")
                  api = ms.get("api")
                  reqs = api.get("totalRequests") if isinstance(api, dict) else None
                  if isinstance(tok, dict):
                      req_part = f", requests={reqs}" if reqs is not None else ""
                      lines.append(
                          f"- `{model_name}`: input={tok.get('prompt', tok.get('input', 0))} "
                          f"(cached={tok.get('cached', 0)}), output={tok.get('candidates', tok.get('output', 0))}, "
                          f"thoughts={tok.get('thoughts', 0)}, total={tok.get('total', 0)}{req_part}"
                      )
          tools = stats.get("tools")
          if isinstance(tools, dict) and tools.get("totalCalls") is not None:
              by_name = tools.get("byName")
              detail = ""
              if isinstance(by_name, dict) and by_name:
                  counts = [
                      f"{k}={v.get('count', 0)}"
                      for k, v in sorted(by_name.items())
                      if isinstance(v, dict)
                  ]
                  if counts:
                      detail = f" ({', '.join(counts)})"
              lines.append(f"- Tool calls: {tools.get('totalCalls')}{detail}")

          if len(lines) > 2:
              out = "\n".join(lines) + "\n"
              print(out.strip())
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as fh:
                      fh.write("\n" + out)
          PY

      - name: Cleanup temporary review context
        if: always()
        run: rm -rf .gemini-review-ctx gemini-artifacts

  publish:
    name: 发布 Gemini PR 审查评论
    needs: review
    if: needs.review.outputs.has_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Download Gemini review bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.review.outputs.artifact_name }}
          path: ${{ runner.temp }}/gemini-review-ctx

      - name: Post Gemini code review to PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CTX_DIR: ${{ runner.temp }}/gemini-review-ctx
        run: |
          python3 "${CTX_DIR}/gemini_review_helper.py" post \
            --pr-number "${{ needs.review.outputs.pr_number }}" \
            --repo "${{ github.repository }}" \
            --context-dir "${CTX_DIR}" \
            --response-file "${CTX_DIR}/gemini_response.txt" \
            --max-comments 15
