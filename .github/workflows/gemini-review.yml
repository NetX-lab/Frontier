name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - qwen3-4b-pd-af-simulator
  workflow_dispatch:
    inputs:
      pr_number:
        description: '需要手动重新审查的 PR 编号'
        required: true
        type: string

concurrency:
  group: gemini-code-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: Gemini PR 自动代码审查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Check GEMINI_API_KEY secret
        env:
          HAS_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          if [ "${HAS_GEMINI_API_KEY}" != "true" ]; then
            echo "::error::未配置仓库 Secret GEMINI_API_KEY。请在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中添加 GEMINI_API_KEY。"
            exit 1
          fi

      - name: Resolve PR number
        id: pr
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          PR_NUMBER="${EVENT_PR_NUMBER:-$INPUT_PR_NUMBER}"
          if [ -z "${PR_NUMBER}" ]; then
            echo "::error::无法解析 PR 编号。"
            exit 1
          fi
          echo "number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr_number) }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare PR context and annotated diff
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/gemini_review_helper.py prepare \
            --pr-number "${{ steps.pr.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --output-dir .gemini-review-ctx

      - name: Skip review when no reviewable code files changed
        if: steps.prepare.outputs.reviewable_files == '0'
        run: |
          echo "本次 PR 改动均位于忽略路径（profiling/数据/图表/子模块），跳过 Gemini Code Review。" >> "${GITHUB_STEP_SUMMARY}"

      - name: Run Gemini CLI code review
        id: gemini_review
        if: steps.prepare.outputs.reviewable_files != '0'
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL || 'gemini-4-hydrogen' }}
          settings: |-
            {
              "model": {
                "maxSessionTurns": 35
              },
              "modelConfigs": {
                "customOverrides": [
                  {
                    "match": {
                      "model": "chat-base-3"
                    },
                    "modelConfig": {
                      "generateContentConfig": {
                        "thinkingConfig": {
                          "thinkingLevel": "${{ vars.GEMINI_THINKING_LEVEL || 'HIGH' }}"
                        }
                      }
                    }
                  },
                  {
                    "match": {
                      "model": "${{ vars.GEMINI_MODEL || 'gemini-4-hydrogen' }}"
                    },
                    "modelConfig": {
                      "generateContentConfig": {
                        "thinkingConfig": {
                          "thinkingLevel": "${{ vars.GEMINI_THINKING_LEVEL || 'HIGH' }}"
                        }
                      }
                    }
                  }
                ]
              },
              "context": {
                "fileName": [
                  ".gemini/styleguide.md"
                ]
              },
              "telemetry": {
                "enabled": false
              },
              "tools": {
                "core": [
                  "read_file",
                  "read_many_files",
                  "list_directory",
                  "glob",
                  "search_file_content"
                ],
                "autoAccept": true
              }
            }
          prompt: |-
            你是 Frontier（LLM 推理离散事件仿真器）仓库的资深代码审查工程师。
            `.gemini/styleguide.md` 已自动注入上下文，无需再次读取。请按照以下步骤完成本次 Pull Request 的中文代码审查，并**严格只输出一个 JSON 对象**：

            1. 在**同一轮**内并行使用 `read_file` 阅读 `.gemini-review-ctx/pr_context.md` 和 `.gemini-review-ctx/pr_diff.txt`。
            2. **严格控制上下文与工具轮次**（降低成本并避免撞上限）：
               - 仅当 diff 本身不足以确认问题时，才定向使用 `search_file_content`、`read_many_files` 或并行的 `read_file` 批量核查直接相关的调用方或定义，**避免逐个文件串行读取**。
               - **禁止整文件读取 `AGENTS.md`**（体积过大；常规约束已包含在 `.gemini/styleguide.md` 中，仅在确有必要时用 `search_file_content` 精准检索关键词）。
               - **禁止遍历或扫描 `data/profiling/`、`figs/`、`cache/`、`outputs/` 等大体积目录**。
               - 本次会话硬上限为 35 轮：小型/配置/文档 PR 应在 1~4 轮内输出；多文件核心代码 PR 尽量批量并行查阅直接相关调用方，务必在 **第 25 轮前** 结束查阅并直接输出最终 JSON，切勿耗尽轮次。
            3. **严格控制信噪比**：
               - 全程使用**简体中文**。
               - **只报告 `CRITICAL`（严重）、`HIGH`（高）、`MEDIUM`（中）级别问题**，彻底忽略 `LOW` / `NIT` / 纯格式风格问题。
               - 最多输出 15 条最具价值的问题；若无中高优先级问题，`comments` 返回空数组 `[]`。
            4. 行号要求：`.gemini-review-ctx/pr_diff.txt` 中每行新增/上下文行前缀的 `L<数字>` 即新文件精确行号。行内评论的 `path` 必须是相对仓库根目录的路径（保留 `.github/` 等点开头前缀），`line` 必须是对应 diff hunk 中带 `L<数字>` 的整数行号；如问题跨文件或不在 diff 行内，可填相关文件并将 `line` 设为 `null`。

            最终回复**只能包含如下格式的纯 JSON（不要附加多余解释文本）**：
            ```json
            {
              "verdict": "APPROVE | COMMENT | REQUEST_CHANGES",
              "summary": "2-5 句简体中文总结：概括本次变更目的、核心风险点与整体评价。",
              "comments": [
                {
                  "path": "relative/path/to/file.py",
                  "line": 123,
                  "start_line": null,
                  "severity": "CRITICAL | HIGH | MEDIUM",
                  "category": "仿真保真度 | 逻辑缺陷 | 架构边界 | 性能 | 可维护性 | 测试覆盖 | 安全",
                  "title": "简短问题标题",
                  "body": "清晰的中文根因分析、影响范围与具体修改建议。",
                  "suggestion": null
                }
              ]
            }
            ```
            说明：`suggestion` 仅在你能给出可直接替换该行/该段代码的精确代码片段时填写（纯代码，不含 Markdown 围栏），否则填 `null`。

      - name: Log Gemini CLI usage stats
        if: always() && steps.prepare.outputs.reviewable_files != '0'
        run: |
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("h", ".github/scripts/gemini_review_helper.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          stats_md = mod.summarize_cli_stats(Path("gemini-artifacts/stdout.log"))
          if stats_md:
              print(stats_md.strip())
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as fh:
                      fh.write("\n" + stats_md)
          else:
              print("No Gemini CLI JSON stats found in gemini-artifacts/stdout.log.")
          PY

      - name: Post Gemini code review to PR
        if: steps.prepare.outputs.reviewable_files != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_RESPONSE: ${{ steps.gemini_review.outputs.summary }}
        run: |
          python3 -c "import os, pathlib; pathlib.Path('.gemini-review-ctx/gemini_response.txt').write_text(os.environ.get('GEMINI_RESPONSE', ''), encoding='utf-8')"
          python3 .github/scripts/gemini_review_helper.py post \
            --pr-number "${{ steps.pr.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --context-dir .gemini-review-ctx \
            --response-file .gemini-review-ctx/gemini_response.txt \
            --max-comments 15

      - name: Cleanup temporary review context
        if: always()
        run: rm -rf .gemini-review-ctx gemini-artifacts
